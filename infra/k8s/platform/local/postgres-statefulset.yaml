apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: icp-postgres
  namespace: workspace-alpha
spec:
  serviceName: icp-postgres
  replicas: 1
  selector:
    matchLabels:
      app: icp-postgres
  template:
    metadata:
      labels:
        app: icp-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: icp-postgres-secret
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: icp-postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: icp-postgres-pvc
  namespace: workspace-alpha
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
