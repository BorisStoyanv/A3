apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-alpha-backend
  namespace: workspace-alpha
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-alpha-frontend
  namespace: workspace-alpha
---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  name: workspace-alpha-build-runner
  namespace: workspace-alpha
---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  name: workspace-alpha-deploy-runner
  namespace: workspace-alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-alpha-backend
  namespace: workspace-alpha
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-alpha-backend
  namespace: workspace-alpha
subjects:
  - kind: ServiceAccount
    name: workspace-alpha-backend
    namespace: workspace-alpha
roleRef:
  kind: Role
  name: workspace-alpha-backend
  apiGroup: rbac.authorization.k8s.io
