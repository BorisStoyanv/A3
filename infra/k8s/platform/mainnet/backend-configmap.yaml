apiVersion: v1
kind: ConfigMap
metadata:
  name: icp-backend-config
  namespace: workspace-alpha
data:
  NODE_ENV: "production"
  PORT: "3000"
  ICP_NETWORK: "ic"
  DFX_IDENTITY: "Uploader-A3"
  LOG_LEVEL: "info"
  DEPLOY_REPLICA_HOST: "ic0.app"
  DEPLOY_WORKDIR_BASE: "/workspace/storage"
  DEPLOY_IDENTITY_SECRET: "identity-uploader-a3"
  DEPLOY_CREATE_CYCLES: "801000000000"
  DEPLOY_MODE_TYPE: "hosted"
  EJECT_ENABLED: "false"
  HOST_CANISTER_ID: "REPLACE_WITH_HOST_CANISTER_ID"
  DFX_WARNING: "-mainnet_plaintext_identity"
  HOST_BASE_DOMAIN: "example.com"
  API_BASE_URL: "https://api.example.com"
  APP_PUBLIC_URL: "https://ui.example.com"
  FRONTEND_BASE_URL: "https://ui.example.com"
  SESSION_COOKIE_SECURE: "true"
  CSRF_COOKIE_DOMAIN: ".example.com"
  ALLOWED_ORIGINS: "https://ui.example.com"
